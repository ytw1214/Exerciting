# 로컬 개발용 MySQL
#   1) cp .env.example .env  →  값 채우기
#   2) docker compose up -d
#   3) ./gradlew bootRun
services:
  mysql:
    image: mysql:8.0
    container_name: exerciting-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: exerciting_db
      MYSQL_USER: ${DB_USERNAME:-exerciting}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 설정하세요}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD를 .env에 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - exerciting-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  exerciting-mysql-data:
