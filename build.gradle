plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.exerciting'
version = '0.0.1-SNAPSHOT'
description = 'Practice_project'

// 빌드하는 머신의 JDK가 무엇이든 Java 17로 컴파일한다 (CI·팀원 PC마다 결과가 달라지지 않게)
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	// Spring Boot 3.5(Spring 6.2)에 맞는 springdoc 2.8.x
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.8'

	// QueryDSL: Spring Boot가 관리하는 5.1.0으로 core/jpa/apt 버전을 맞춘다
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

	implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

	implementation 'org.jsoup:jsoup:1.17.2'
	implementation 'org.seleniumhq.selenium:selenium-java'

	runtimeOnly 'com.mysql:mysql-connector-j'

	// Lombok 버전은 Spring Boot에 맡긴다 (1.18.22 고정은 JDK 21 이상에서 컴파일 실패)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 기본 테스트: H2만으로 도는 테스트 (CI에서 실행)
tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'perf'
	}
}

// 성능 측정: 로컬 MySQL이 떠 있어야 한다.  ./gradlew perfTest
tasks.register('perfTest', Test) {
	description = '로컬 MySQL이 필요한 성능 측정 테스트 (@Tag("perf"))'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'perf'
	}
}

// 실행 가능한 bootJar 하나만 만든다 (Dockerfile에서 *.jar를 복사하기 위해)
tasks.named('jar') {
	enabled = false
}
