spring.application.name=Exerciting

# 로컬 개발: 프로젝트 루트의 .env(KEY=VALUE 형식)를 읽는다. 운영에서는 실제 환경 변수로 주입한다.
# 비밀값(DB 비밀번호, JWT 서명키)은 이 파일에 절대 쓰지 않는다.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/exerciting_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true}
spring.datasource.username=${DB_USERNAME:exerciting}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

jwt.secret=${JWT_SECRET}
app.cookie.secure=${COOKIE_SECURE:true}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jackson.time-zone=Asia/Seoul
