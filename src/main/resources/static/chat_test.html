<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciting 채팅 테스트</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
          font-family: 'Courier New', monospace;
          background: #0a0a0a;
          color: #e0e0e0;
          height: 100vh;
          display: flex;
          flex-direction: column;
        }

        .header {
          padding: 16px 24px;
          border-bottom: 1px solid #222;
          display: flex;
          align-items: center;
          gap: 12px;
          background: #0f0f0f;
        }

        .status-dot {
          width: 8px;
          height: 8px;
          border-radius: 50%;
          background: #444;
          transition: background 0.3s;
        }
        .status-dot.connected { background: #4ade80; box-shadow: 0 0 8px #4ade80; }
        .status-dot.error { background: #f87171; box-shadow: 0 0 8px #f87171; }

        .header-title { font-size: 13px; color: #666; letter-spacing: 2px; text-transform: uppercase; }
        .header-status { font-size: 12px; color: #444; margin-left: auto; }

        .main {
          display: flex;
          flex: 1;
          overflow: hidden;
        }

        .sidebar {
          width: 280px;
          border-right: 1px solid #1a1a1a;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 16px;
          background: #0c0c0c;
          overflow-y: auto;
        }

        .section-label {
          font-size: 10px;
          color: #444;
          letter-spacing: 2px;
          text-transform: uppercase;
          margin-bottom: 6px;
        }

        input, textarea {
          width: 100%;
          background: #111;
          border: 1px solid #222;
          color: #e0e0e0;
          padding: 8px 12px;
          font-family: 'Courier New', monospace;
          font-size: 12px;
          border-radius: 4px;
          outline: none;
          transition: border-color 0.2s;
        }
        input:focus, textarea:focus { border-color: #4ade80; }

        button {
          width: 100%;
          padding: 9px;
          font-family: 'Courier New', monospace;
          font-size: 11px;
          letter-spacing: 1px;
          text-transform: uppercase;
          border: none;
          border-radius: 4px;
          cursor: pointer;
          transition: all 0.2s;
        }

        .btn-primary {
          background: #4ade80;
          color: #000;
          font-weight: bold;
        }
        .btn-primary:hover { background: #22c55e; }
        .btn-primary:disabled { background: #222; color: #444; cursor: not-allowed; }

        .btn-danger {
          background: transparent;
          color: #f87171;
          border: 1px solid #f87171;
        }
        .btn-danger:hover { background: #f87171; color: #000; }

        .btn-secondary {
          background: transparent;
          color: #60a5fa;
          border: 1px solid #60a5fa;
        }
        .btn-secondary:hover { background: #60a5fa; color: #000; }

        .divider { border: none; border-top: 1px solid #1a1a1a; }

        .chat-area {
          flex: 1;
          display: flex;
          flex-direction: column;
        }

        .messages {
          flex: 1;
          overflow-y: auto;
          padding: 20px;
          display: flex;
          flex-direction: column;
          gap: 8px;
        }

        .message {
          display: flex;
          flex-direction: column;
          gap: 2px;
          animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
          from { opacity: 0; transform: translateY(4px); }
          to { opacity: 1; transform: translateY(0); }
        }

        .message-meta {
          font-size: 10px;
          color: #444;
          letter-spacing: 1px;
        }

        .message-bubble {
          display: inline-block;
          padding: 8px 14px;
          border-radius: 4px;
          font-size: 13px;
          line-height: 1.5;
          max-width: 70%;
          word-break: break-word;
        }

        .message.mine { align-items: flex-end; }
        .message.mine .message-bubble {
          background: #1a2e1a;
          border: 1px solid #2d4a2d;
          color: #4ade80;
        }

        .message.other .message-bubble {
          background: #1a1a2e;
          border: 1px solid #2d2d4a;
          color: #93c5fd;
        }

        .message.system .message-bubble {
          background: #1a1a1a;
          border: 1px solid #222;
          color: #666;
          font-size: 11px;
          max-width: 100%;
          width: 100%;
          text-align: center;
        }
        .message.system { align-items: center; }

        .input-area {
          padding: 16px 20px;
          border-top: 1px solid #1a1a1a;
          display: flex;
          gap: 10px;
          background: #0c0c0c;
        }

        .input-area input {
          flex: 1;
        }

        .send-btn {
          width: auto;
          padding: 8px 20px;
          background: #4ade80;
          color: #000;
          font-weight: bold;
          font-size: 11px;
          letter-spacing: 1px;
          white-space: nowrap;
        }
        .send-btn:hover { background: #22c55e; }
        .send-btn:disabled { background: #222; color: #444; cursor: not-allowed; }

        .log-area {
          height: 120px;
          border-top: 1px solid #1a1a1a;
          padding: 10px 20px;
          overflow-y: auto;
          background: #080808;
        }

        .log-entry {
          font-size: 11px;
          color: #444;
          line-height: 1.6;
          font-family: 'Courier New', monospace;
        }
        .log-entry.success { color: #4ade80; }
        .log-entry.error { color: #f87171; }
        .log-entry.info { color: #60a5fa; }

        .empty-state {
          flex: 1;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #2a2a2a;
          font-size: 12px;
          letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="status-dot" id="statusDot"></div>
    <span class="header-title">Exerciting / Chat Debug</span>
    <span class="header-status" id="statusText">DISCONNECTED</span>
</div>

<div class="main">
    <div class="sidebar">
        <div>
            <div class="section-label">서버 설정</div>
            <input type="text" id="serverUrl" value="http://localhost:8080/websocket" placeholder="WebSocket URL">
        </div>

        <div>
            <div class="section-label">JWT 토큰</div>
            <textarea id="jwtToken" rows="3" placeholder="Bearer 없이 토큰만 입력"></textarea>
        </div>

        <button class="btn-primary" id="connectBtn" onclick="connect()">연결</button>
        <button class="btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>연결 끊기</button>

        <hr class="divider">

        <div>
            <div class="section-label">채팅방 ID</div>
            <input type="number" id="chatRoomId" value="1" placeholder="chatRoomId">
        </div>

        <button class="btn-secondary" id="subscribeBtn" onclick="subscribe()" disabled>구독</button>
    </div>

    <div class="chat-area">
        <div class="messages" id="messages">
            <div class="empty-state">// 연결 후 채팅방을 구독하세요</div>
        </div>

        <div class="input-area">
            <input type="text" id="messageInput" placeholder="메시지 입력..." disabled onkeydown="if(event.key==='Enter') sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>SEND</button>
        </div>

        <div class="log-area" id="logArea"></div>
    </div>
</div>

<script>
    let stompClient = null;
    let subscription = null;

    function log(msg, type = '') {
      const logArea = document.getElementById('logArea');
      const entry = document.createElement('div');
      entry.className = `log-entry ${type}`;
      entry.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
      logArea.appendChild(entry);
      logArea.scrollTop = logArea.scrollHeight;
    }

    function addMessage(content, type = 'other', meta = '') {
      const messages = document.getElementById('messages');
      const empty = messages.querySelector('.empty-state');
      if (empty) empty.remove();

      const msg = document.createElement('div');
      msg.className = `message ${type}`;
      msg.innerHTML = `
        ${meta ? `<div class="message-meta">${meta}</div>` : ''}
        <div class="message-bubble">${content}</div>
      `;
      messages.appendChild(msg);
      messages.scrollTop = messages.scrollHeight;
    }

    function setStatus(connected) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      dot.className = `status-dot ${connected ? 'connected' : ''}`;
      text.textContent = connected ? 'CONNECTED' : 'DISCONNECTED';
    }

    function connect() {
      const url = document.getElementById('serverUrl').value;
      const token = document.getElementById('jwtToken').value.trim();

      if (!token) { log('토큰을 입력하세요', 'error'); return; }

      log(`연결 시도: ${url}`, 'info');

      // SockJS 먼저 시도, 실패하면 raw WS
      let socket;
      try {
        socket = new SockJS(url);
      } catch(e) {
        socket = new WebSocket(url.replace('http', 'ws'));
      }

      stompClient = Stomp.over(socket);
      stompClient.debug = (msg) => log(msg);

      stompClient.connect(
        { Authorization: `Bearer ${token}` },
        function(frame) {
          log('STOMP 연결 성공', 'success');
          setStatus(true);
          addMessage('서버에 연결되었습니다.', 'system');
          document.getElementById('connectBtn').disabled = true;
          document.getElementById('disconnectBtn').disabled = false;
          document.getElementById('subscribeBtn').disabled = false;
        },
        function(error) {
          log(`연결 실패: ${error}`, 'error');
          setStatus(false);
          document.getElementById('statusDot').className = 'status-dot error';
        }
      );
    }

    function disconnect() {
      if (stompClient) {
        stompClient.disconnect(() => {
          log('연결 종료', 'info');
          setStatus(false);
          addMessage('연결이 종료되었습니다.', 'system');
          document.getElementById('connectBtn').disabled = false;
          document.getElementById('disconnectBtn').disabled = true;
          document.getElementById('subscribeBtn').disabled = true;
          document.getElementById('sendBtn').disabled = true;
          document.getElementById('messageInput').disabled = true;
        });
      }
    }

    function subscribe() {
    const chatRoomId = document.getElementById('chatRoomId').value;
    if (!chatRoomId) { log('채팅방 ID를 입력하세요', 'error'); return; }

    if (subscription) subscription.unsubscribe();

    subscription = stompClient.subscribe(`/sub/matching/chat/${chatRoomId}`, function(message) {
        const body = JSON.parse(message.body);
        addMessage(
            body.message,
            'other',
            `${body.senderName || body.senderId} · ${body.sendAt || ''}`
        );
    });

    log(`/sub/matching/chat/${chatRoomId} 구독 완료`, 'success');
    addMessage(`채팅방 #${chatRoomId} 구독 완료`, 'system');
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('messageInput').disabled = false;
    document.getElementById('messageInput').focus();

    loadMessages();
}

    function sendMessage() {
      const input = document.getElementById('messageInput');
      const chatRoomId = document.getElementById('chatRoomId').value;
      const msg = input.value.trim();

      if (!msg || !stompClient) return;

      stompClient.send(
        `/pub/chat/${chatRoomId}`,
        {},
        JSON.stringify({ message: msg })
      );

      input.value = '';
      log(`메시지 전송: ${msg}`, 'info');
    }
    async function loadMessages() {
    const chatRoomId = document.getElementById('chatRoomId').value;
    const token = document.getElementById('jwtToken').value.trim();

    try {
        const res = await fetch(`http://localhost:8080/api/v1/chat/${chatRoomId}/messages`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 204) {
            addMessage('메시지가 없습니다.', 'system');
            return;
        }
        if (res.status === 403) {
            addMessage('접근 권한이 없는 채팅방입니다.', 'system');
            return;
        }
        if (res.status === 404) {
            addMessage('존재하지 않는 채팅방입니다.', 'system');
            return;
        }

        const messages = await res.json();
        addMessage(`── 이전 메시지 (${messages.length}개) ──`, 'system');
        messages.forEach(m => {
            addMessage(
                m.message,
                'other',
                `${m.senderName || m.senderId} · ${m.sendAt || ''}`
            );
        });

        log(`메시지 ${messages.length}개 로드 완료`, 'success');
    } catch(e) {
        log(`메시지 로드 실패: ${e.message}`, 'error');
    }
}
</script>
</body>
</html>
