# 성능 측정 전용 DB. 루트의 .env에서 접속 정보를 읽는다 (DB를 새로 만들어야 하므로 root 계정 사용)
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/exerciting_perf?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=${DB_ROOT_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.hibernate.ddl-auto=create

spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=off
logging.level.org.hibernate.orm.jdbc.bind=off

